name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Unzip Project Files
      run: |
        if [ -f "novaplay.zip" ]; then
          unzip novaplay.zip -d unzipped_project
          rm -f novaplay.zip
        elif [ -f "project.zip" ]; then
          unzip project.zip -d unzipped_project
          rm -f project.zip
        else
          echo "Error: No zip file found!" && exit 1
        fi
        
        if [ -d "unzipped_project/app" ]; then
          mv unzipped_project/* . || true
          mv unzipped_project/.* . || true
        else
          SUB_DIR=$(find unzipped_project -name "app" -type d -prune | head -n 1)
          if [ ! -z "$SUB_DIR" ]; then
            PROJECT_ROOT=$(dirname "$SUB_DIR")
            mv "$PROJECT_ROOT"/* . || true
            mv "$PROJECT_ROOT"/.* . || true
          fi
        fi
        rm -rf unzipped_project

    # YEH STEP AAPKE APP KE LIYE EXACT SAHI GRADLE VERSION (9.3.1) GENERATE KAREGA
    - name: Generate Sahi Gradle Wrapper
      run: |
        gradle wrapper --gradle-version 9.3.1

    - name: Make Gradle Executable
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Vidiopen-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        

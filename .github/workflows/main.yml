name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Unzip Project Files
      run: |
        if [ -f "novaplay.zip" ]; then
          unzip novaplay.zip -d unzipped_project
          rm -f novaplay.zip
        elif [ -f "project.zip" ]; then
          unzip project.zip -d unzipped_project
          rm -f project.zip
        else
          echo "Error: No zip file found!" && exit 1
        fi
        
        # Ye command unzipped folder ke andar jahan bhi gradlew hai, uske saare content ko root par le aayegi
        GRADLEW_PATH=$(find unzipped_project -name "gradlew" | head -n 1)
        if [ -z "$GRADLEW_PATH" ]; then
          echo "Error: gradlew not found anywhere in the zip!" && exit 1
        fi
        PROJECT_ROOT=$(dirname "$GRADLEW_PATH")
        mv "$PROJECT_ROOT"/* . || true
        mv "$PROJECT_ROOT"/.* . || true
        rm -rf unzipped_project

    - name: Make Gradle Executable
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Vidiopen-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk

name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Unzip Project Files
      run: |
        if [ -f "novaplay.zip" ]; then
          unzip novaplay.zip -d unzipped_project
          rm -f novaplay.zip
        elif [ -f "project.zip" ]; then
          unzip project.zip -d unzipped_project
          rm -f project.zip
        else
          echo "Error: No zip file found!" && exit 1
        fi
        
        # Files ko root level par move karna
        if [ -d "unzipped_project/app" ]; then
          mv unzipped_project/* . || true
          mv unzipped_project/.* . || true
        else
          # Agar nested folder hai toh uske andar se app folder dhoondna
          SUB_DIR=$(find unzipped_project -name "app" -type d -prune | head -n 1)
          if [ ! -z "$SUB_DIR" ]; then
            PROJECT_ROOT=$(dirname "$SUB_DIR")
            mv "$PROJECT_ROOT"/* . || true
            mv "$PROJECT_ROOT"/.* . || true
          fi
        fi
        rm -rf unzipped_project

    # AGAR GRADLEW MISSING HAI, TOH YEH STEP USSE KHUD GENERATE KAR DEGA
    - name: Generate Missing Gradle Wrapper
      run: |
        if [ ! -f "gradlew" ]; then
          echo "gradlew missing! Generating a new Gradle wrapper..."
          gradle wrapper --gradle-version 8.7
        fi

    - name: Make Gradle Executable
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Vidiopen-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk

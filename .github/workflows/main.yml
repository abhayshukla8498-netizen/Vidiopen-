name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Isse aap manually bhi build start kar sakte hain

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    # Cloud par zip file ko unzip karne ka step
    - name: Unzip Project Files
      run: |
        unzip project.zip -d unzipped_project
        mv unzipped_project/* . || true
        mv unzipped_project/.* . || true
        rm -rf unzipped_project project.zip

    - name: Make Gradle Executable
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Vidiopen-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        

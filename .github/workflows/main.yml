name: Build Android Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Unzip Project Files
      run: |
        if [ -f "novaplay.zip" ]; then
          unzip novaplay.zip -d unzipped_project
          rm -f novaplay.zip
        elif [ -f "project.zip" ]; then
          unzip project.zip -d unzipped_project
          rm -f project.zip
        else
          echo "Error: No zip file found!" && exit 1
        fi
        
        if [ -d "unzipped_project/app" ]; then
          mv unzipped_project/* . || true
          mv unzipped_project/.* . || true
        else
          SUB_DIR=$(find unzipped_project -name "app" -type d -prune | head -n 1)
          if [ ! -z "$SUB_DIR" ]; then
            PROJECT_ROOT=$(dirname "$SUB_DIR")
            mv "$PROJECT_ROOT"/* . || true
            mv "$PROJECT_ROOT"/.* . || true
          fi
        fi
        rm -rf unzipped_project

    - name: Generate Sahi Gradle Wrapper
      run: |
        gradle wrapper --gradle-version 9.3.1

    - name: Make Gradle Executable
      run: chmod +x gradlew

    # AAPKI CUSTOM PASSWORD SE REAL SIGNING KEYSTORE BANANE KA STEP
    - name: Generate Custom Release Keystore
      run: |
        keytool -genkey -v -keystore my-upload-key.jks -storepass Abhay@2026 -alias upload -keypass Abhay@2026 -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Abhay Shukla,O=Vidiopen,C=IN"

    # GRADLE KO RELEASE COMMAND DENA AUR ENV VARIABLES CONFIG KARNA
    - name: Build Real Release APK
      env:
        KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
        STORE_PASSWORD: Abhay@2026
        KEY_PASSWORD: Abhay@2026
      run: ./gradlew assembleRelease

    - name: Upload Real Release APK
      uses: actions/upload-artifact@v4
      with:
        name: Vidiopen-Real-Release-APK
        path: app/build/outputs/apk/release/app-release.apk
        
